<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>後期時間割</title>
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1d2330;--mu:#677084;--ln:#e1e5ec;--ac:#2456d6;--bs:65%;--bl:90%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--sf:#1b1f27;--tx:#e8ebf2;--mu:#9aa3b5;--ln:#2c323d;--ac:#7ea2ff;--bs:35%;--bl:24%}}
:root[data-theme="dark"]{--bg:#12151b;--sf:#1b1f27;--tx:#e8ebf2;--mu:#9aa3b5;--ln:#2c323d;--ac:#7ea2ff;--bs:35%;--bl:24%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 8px 24px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h1{font-size:17px;margin:0;flex:1}
.top small{display:block;font-size:12px;color:var(--mu);font-weight:400;margin-top:2px}
button{font:inherit;font-size:14px;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 11px;cursor:pointer}
button:focus-visible,.ev:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.cal{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:34px repeat(5,1fr)}
.hd{border-bottom:1px solid var(--ln);text-align:center;font-size:12px;color:var(--mu);padding:6px 0}
.hd b{display:inline-block;min-width:24px;line-height:24px;border-radius:12px;font-size:14px;color:var(--tx)}
.hd.today b{background:var(--ac);color:#fff}
.body{position:relative;height:625px}
.col{position:relative;border-left:1px solid var(--ln)}
.col.today{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.tl{position:absolute;left:0;width:34px;font-size:10px;color:var(--mu);text-align:right;padding-right:4px;box-sizing:border-box;transform:translateY(-1px)}
.ev{position:absolute;left:2px;right:2px;overflow:hidden;border-radius:6px;padding:3px 4px;box-sizing:border-box;font-size:10px;line-height:1.3;text-align:left;cursor:pointer;color:var(--tx);background:hsl(var(--h) var(--bs) var(--bl));border:1px solid hsl(var(--h) 55% 50%);border-left-width:4px}
.ev b{display:block;font-size:11px}
.ev.l{border-style:dashed;border-left-style:solid}
.ev.o{border-style:dotted;border-left-style:solid}
.ev.sel{box-shadow:0 0 0 2px var(--ac)}
.det{margin-top:10px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7;min-height:48px}
.det h2{font-size:16px;margin:0 0 4px}
.det .mu,.lg{color:var(--mu);font-size:12px}
.lg{margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1}
.tabs button.on,.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{white-space:nowrap;padding:4px 10px;font-size:13px}
.gh{font-size:13px;font-weight:600;margin:14px 0 4px}
.gh.late{color:#d9342b}
.gh span{color:var(--mu);font-weight:400;margin-left:4px}
#v2 ul{list-style:none;padding:0;margin:0;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
#v2 li{padding:8px 12px;border-bottom:1px solid var(--ln)}
#v2 li:last-child{border-bottom:0}
.lt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lt label{flex:1;font-size:14px}
.ls{font-size:12px;color:var(--mu);margin-top:2px;display:flex;gap:6px;align-items:center}
.chip{display:inline-block;padding:0 6px;border-radius:6px;font-size:11px;color:var(--tx);background:hsl(var(--h) var(--bs) var(--bl));border:1px solid hsl(var(--h) 55% 50%)}
.add.w{flex-wrap:wrap}
.add.w input[type=text]{flex:1 1 100%}
.add select,.add input[type=date]{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
#v2 .add{margin:0 0 6px}
.bg{display:inline-block;background:var(--ac);color:#fff;border-radius:8px;padding:0 4px;font-size:9px;margin-left:2px}
.todo{margin-top:10px;border-top:1px solid var(--ln);padding-top:8px}
.th{font-size:13px;color:var(--mu)}
.todo ul{list-style:none;padding:0;margin:4px 0}
.todo li{display:flex;align-items:center;justify-content:space-between;gap:8px}
.todo label{flex:1}
.dn{text-decoration:line-through;color:var(--mu)}
.add{display:flex;gap:6px;margin-top:6px}
.add input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
</style>
</head>

const p=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const EV={};
raw.trim().split('\n').forEach(l=>{
  const [md,sl,sj,n,f,r]=l.trim().split(' ');
  const m=+md.slice(0,2),d=+md.slice(2);
  const k=(m<=3?2027:2026)+'-'+p(m)+'-'+p(d);
  (EV[k]=EV[k]||[]).push({sl:+sl-1,sj,n,f,r:r==='-'?'':r});
});
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const hm=m=>Math.floor(m/60)+':'+p(m%60);
let cur=monday(new Date()),sel=null;
const $=id=>document.getElementById(id);
const shortRoom=r=>r.replace('共用講義室','共用').replace('講義室','室');
function render(){
  const days=[...Array(5)].map((_,i)=>{const d=new Date(cur);d.setDate(d.getDate()+i);return d});
  const tk=key(new Date());
  $('rng').innerHTML=`${days[0].getMonth()+1}/${days[0].getDate()} – ${days[4].getMonth()+1}/${days[4].getDate()}<small>${days[0].getFullYear()}年</small>`;
  $('hdr').innerHTML='<div class="hd"></div>'+days.map(d=>`<div class="hd ${key(d)===tk?'today':''}">${'月火水木金'[d.getDay()-1]}<br><b>${d.getDate()}</b></div>`).join('');
  const O=510;
  let h='<div style="position:relative">'+T.map(t=>`<div class="tl" style="top:${t[0]-O}px">${t[2]}</div>`).join('')+'</div>';
  days.forEach(d=>{
    const k=key(d);
    h+=`<div class="col ${k===tk?'today':''}">`+(EV[k]||[]).map(e=>{
      const t=T[e.sl],s=S[e.sj];
      const id=k+'_'+e.sl;
      return `<button class="ev ${e.f==='l'?'l':e.f==='o'?'o':''} ${sel===id?'sel':''}" data-id="${id}" style="--h:${s[2]};top:${t[0]-O}px;height:${t[1]-t[0]}px"><b>${s[1]}${bd(id)}</b>${/[erx]/.test(e.sj)?'':'第'+e.n+'回'}<br>${e.f==='o'?'オンデマンド':shortRoom(e.r)||(e.f==='l'?'ライブ':'')}</button>`;
    }).join('')+'</div>';
  });
  $('bd').innerHTML=h;updTc();
  $('bd').querySelectorAll('.ev').forEach(b=>b.onclick=()=>{sel=b.dataset.id;show(days);render()});
  if(!sel)show(days);
}
function show(days){
  const el=$('det');
  if(sel){
    const [k,sl]=sel.split('_');const e=EV[k].find(x=>x.sl==sl),s=S[e.sj],t=T[e.sl];
    const [y,m,d]=k.split('-').map(Number);
    el.innerHTML=`<h2>${s[0]}</h2>${m}月${d}日 ${e.sl+1}講 ${t[2]}–${t[3]}<br>${/[erx]/.test(e.sj)?'':'第'+e.n+'回 ・ 必修<br>'}${e.f?'形態：'+F[e.f]+'<br>':''}${e.r?'教室：'+e.r:''}<div class="todo" id="todo"></div>`;
    todoUI(sel);
    return;
  }
  const c=days.reduce((a,d)=>a+(EV[key(d)]||[]).length,0);
  el.innerHTML=c?`<span class="mu">この週は ${c} コマ。授業をタップすると詳細が出ます。</span>`:`<span class="mu">この週に授業はありません。</span>`;
}
let TD={};
try{TD=JSON.parse(localStorage.getItem('tt-todos')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('tt-todos',JSON.stringify(TD))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bd(id){const n=(TD[id]||[]).filter(x=>!x.d).length;return n?` <span class="bg">${n}</span>`:''}
function todoUI(id){
  const box=$('todo'),list=TD[id]||[];
  box.innerHTML=`<div class="th">やること</div><ul>${list.map((x,i)=>`<li><label><input type="checkbox" data-i="${i}" ${x.d?'checked':''}> <span class="${x.d?'dn':''}">${esc(x.t)}</span>${x.u?` <small>${md(x.u)}まで</small>`:''}</label><button data-x="${i}" aria-label="削除">×</button></li>`).join('')}</ul><div class="add w"><input type="text" id="ti" placeholder="例：小テスト範囲を復習" maxlength="80"><input type="date" id="td" value="${id.split('_')[0]}"><button id="ta">追加</button></div>`;
  const done=()=>{if(!(TD[id]||[]).length)delete TD[id];save();todoUI(id);render()};
  const add=()=>{const v=$('ti').value.trim();if(!v)return;(TD[id]=TD[id]||[]).push({t:v,d:false,u:$('td').value});done()};
  $('ta').onclick=add;
  $('ti').onkeydown=ev=>{if(ev.key==='Enter')add()};
  box.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{TD[id][+c.dataset.i].d=c.checked;done()});
  box.querySelectorAll('li button').forEach(b=>b.onclick=()=>{TD[id].splice(+b.dataset.x,1);done()});
}
const md=u=>{const a=u.split('-');return +a[1]+'/'+ +a[2]};
let flt='',nsel='s';
function allTodos(){const o=[];for(const k in TD){TD[k].forEach((x,i)=>{let sj,src;if(k.startsWith('s_')){sj=k.slice(2);src='科目共通'}else{const q=k.split('_'),e=(EV[q[0]]||[]).find(z=>z.sl==q[1]);if(!e)return;sj=e.sj;src=md(q[0])+' '+(+q[1]+1)+'講'}o.push({k,i,x,sj,src})})}return o}
function updTc(){const n=allTodos().filter(o=>!o.x.d).length;$('tc').textContent=n;$('tc').style.display=n?'':'none'}
function grp(o){if(o.x.d)return 5;const u=o.x.u;if(!u)return 4;const w=new Date(),t=key(w);if(u<t)return 0;if(u===t)return 1;w.setDate(w.getDate()+6-((w.getDay()+6)%7));return u<=key(w)?2:3}
const GN=['期限切れ','今日','今週中','来週以降','期限なし','完了'];
function v2(){
  const box=$('v2'),sub=Object.keys(S).filter(c=>!/[erx]/.test(c)),sv=flt||nsel;
  const all=allTodos().filter(o=>!flt||o.sj===flt);
  let h=`<div class="chips"><button data-f="" class="${flt?'':'on'}">すべて</button>${sub.map(c=>`<button data-f="${c}" class="${flt===c?'on':''}">${S[c][1]}</button>`).join('')}</div>`;
  h+=`<div class="add w"><input type="text" id="nt" placeholder="科目のやること" maxlength="80"><select id="ns">${sub.map(c=>`<option value="${c}" ${c===sv?'selected':''}>${S[c][1]}</option>`).join('')}</select><input type="date" id="nd"><button id="na">追加</button></div>`;
  GN.forEach((n,g)=>{
    const it=all.filter(o=>grp(o)===g).sort((a,b)=>(a.x.u||'9').localeCompare(b.x.u||'9'));
    if(!it.length)return;
    h+=`<div class="gh ${g?'':'late'}">${n}<span>${it.length}</span></div><ul>`+it.map(o=>`<li><div class="lt"><label><input type="checkbox" data-k="${o.k}" data-i="${o.i}" ${o.x.d?'checked':''}> <span class="${o.x.d?'dn':''}">${esc(o.x.t)}</span></label><button data-k="${o.k}" data-x="${o.i}" aria-label="削除">×</button></div><div class="ls"><span class="chip" style="--h:${S[o.sj][2]}">${S[o.sj][1]}</span>${o.src}${o.x.u?' ・ '+md(o.x.u)+'まで':''}</div></li>`).join('')+'</ul>';
  });
  if(!all.length)h+='<div class="det"><span class="mu">やることはありません。上で科目のやることを追加するか、カレンダーの授業から追加できます。</span></div>';
  box.innerHTML=h;
  box.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;v2()});
  $('ns').onchange=e=>{nsel=e.target.value};
  const add=()=>{const v=$('nt').value.trim();if(!v)return;nsel=$('ns').value;const k='s_'+nsel;(TD[k]=TD[k]||[]).push({t:v,d:false,u:$('nd').value});save();v2();updTc()};
  $('na').onclick=add;$('nt').onkeydown=e=>{if(e.key==='Enter')add()};
  box.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{TD[c.dataset.k][+c.dataset.i].d=c.checked;save();v2();render()});
  box.querySelectorAll('li button').forEach(b=>b.onclick=()=>{const l=TD[b.dataset.k];l.splice(+b.dataset.x,1);if(!l.length)delete TD[b.dataset.k];save();v2();render()});
}
function setTab(n){$('v1').hidden=n!==1;$('v2').hidden=n!==2;$('t1').className=n===1?'on':'';$('t2').className=n===2?'on':'';if(n===2)v2()}
$('t1').onclick=()=>setTab(1);$('t2').onclick=()=>setTab(2);
$('prev').onclick=()=>{cur.setDate(cur.getDate()-7);sel=null;render()};
$('next').onclick=()=>{cur.setDate(cur.getDate()+7);sel=null;render()};
$('now').onclick=()=>{cur=monday(new Date());sel=null;render()};
render();
</script>
